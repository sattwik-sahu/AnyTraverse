name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U ruff
      - run: ruff check src
      - run: ruff format --check src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Install CPU-only torch (keeps CI fast and validates the torch floor)
        run: pip install -U torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with test deps
        run: pip install -U pip && pip install -e .[hf,viz] pytest pytest-cov
      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: pip install -U torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -U build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheeltest/bin/pip install -q dist/*.whl
          /tmp/wheeltest/bin/python -c "import anytraverse; print(anytraverse.__version__)"
